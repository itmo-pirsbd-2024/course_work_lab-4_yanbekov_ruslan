syntax = "proto3";

option java_package = "com.example.imageprocessing";
option java_outer_classname = "ImageProcessingProto";

service ImageProcessingService {
  rpc processImage(ImageRequest) returns (ImageResponse);
}

message ResizeParams {
  int32 width = 1;
  int32 height = 2;
}

message RotateParams {
  double angle = 1;
}

message GrayscaleParams {
}

message InvertParams {
}

message ImageRequest {
  bytes imageData = 1;

  oneof operation {
    ResizeParams resizeParams = 2;
    RotateParams rotateParams = 3;
    GrayscaleParams grayscaleParams = 4;
    InvertParams invertParams = 5;
  }
}

message ImageResponse {
  bytes imageData = 1;
}
